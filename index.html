<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minik Keşifler</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff4df,#e9f8ff);color:#29304b;font:17px 'Trebuchet MS',system-ui,sans-serif}header,main{max-width:1000px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;font-size:24px;font-weight:900}.card{background:white;border-radius:25px;padding:24px;box-shadow:0 10px 35px #34406c20;margin:14px 0}h1{text-align:center;font-size:clamp(28px,6vw,44px);margin:6px}p{text-align:center}.tabs,.row,.answers,.palette{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn,.answer{border:0;border-radius:16px;background:#e7f5ff;color:#29304b;padding:13px 18px;font-size:17px;font-weight:800;cursor:pointer}.active,.primary{background:#ffdf79}.activity{display:none}.activity.active{display:block}.write{display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:center}.trace{height:240px;border:3px dashed #f5d681;background:#fff9eb;border-radius:20px;display:grid;place-items:center;position:relative;overflow:hidden}.letter{font-size:170px;color:#e8d9b5;font-weight:900}.trace canvas{position:absolute;width:100%;height:100%;inset:0;touch-action:none}.balloon{width:min(100%,600px);display:block;margin:auto;touch-action:none}.swatch{width:38px;height:38px;border:3px solid white;border-radius:50%;cursor:pointer;box-shadow:0 1px 5px #555}.math{text-align:center;font-size:60px;color:#5867c8;font-weight:bold}.celebration{position:fixed;inset:0;background:#281e56dd;display:none;place-items:center;overflow:hidden}.celebration.show{display:grid}.party{z-index:2;text-align:center;background:#fffdf7;border-radius:30px;padding:32px;max-width:440px;width:90%;animation:pop .6s}.party h2{color:#f04f83;font-size:44px;margin:5px}.face{font-size:75px}@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}.conf{position:absolute;top:-20px;width:12px;height:20px;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(900deg)}}@media(max-width:650px){.write{grid-template-columns:1fr}.trace{height:210px}}</style><header><span>🌈 Minik Keşifler</span><span>⭐ <b id="score">0</b></span></header><main><h1>Oynayalım, öğrenelim! 🎈</h1><p>Yaz, boya, öğren!</p><nav class="tabs"><button class="btn active" data-tab="write">✍️ Harf yaz</button><button class="btn" data-tab="color">🎨 Boyama</button><button class="btn" data-tab="math">🧠 Mini soru</button></nav><section class="card activity active" id="write"><h2>Harfini çiz!</h2><p>Soluk harfin üzerinden parmağınla geç.</p><div class="write"><div class="trace"><span class="letter" id="letter">A</span><canvas id="draw"></canvas></div><div class="row"><span style="font-size:65px" id="emoji">🐝</span><b id="word">A — Arı</b><button class="btn" onclick="clearDraw()">Temizle ↻</button><button class="btn primary" onclick="nextLetter()">Başardım! ⭐</button></div></div><p id="wf"></p></section><section class="card activity" id="color"><h2 style="text-align:center">Balonu renklendir! 🎈</h2><p>Renk seç, balonun üzerine dokun.</p><div class="palette" id="palette"></div><canvas class="balloon" id="balloon" width="600" height="380"></canvas><p><button class="btn" onclick="drawBalloon()">Baştan boya ↻</button></p></section><section class="card activity" id="math"><h2>Minik düşünme zamanı!</h2><p>Doğru cevabı seç.</p><div class="math" id="q"></div><div class="answers" id="answers"></div><p id="mf"></p></section></main><div class="celebration" id="party"><div class="party"><div class="face">🥳🎉</div><h2>Harikasın!</h2><p>10 yıldız topladın! Sen bir süpersin! 🌟</p><button class="btn primary" onclick="closeParty()">Partiye devam! 🎈</button></div></div><script>let score=0,partyShown=false;function star(){score++;document.querySelector('#score').textContent=score;if(score>=10&&!partyShown){partyShown=true;startParty()}}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.activity').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});let letters=[['A','Arı','🐝'],['E','Elma','🍎'],['M','Muz','🍌'],['O','Okul','🏫'],['S','Yıldız','⭐']],li=0,d=document.querySelector('#draw'),ctx=d.getContext('2d'),drawing=false;function fit(){let r=d.getBoundingClientRect();d.width=r.width*devicePixelRatio;d.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=10;ctx.lineCap='round';ctx.strokeStyle='#6c83ee'}fit();onresize=fit;d.onpointerdown=e=>{drawing=true;d.setPointerCapture(e.pointerId);let r=d.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)};d.onpointermove=e=>{if(drawing){let r=d.getBoundingClientRect();ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()}};d.onpointerup=()=>drawing=false;function clearDraw(){ctx.clearRect(0,0,d.width,d.height)}function nextLetter(){star();document.querySelector('#wf').textContent='Harika çizdin! ⭐';li=(li+1)%letters.length;letter.textContent=letters[li][0];word.textContent=letters[li][0]+' — '+letters[li][1];emoji.textContent=letters[li][2];clearDraw()}let colors=['#ff6688','#ffbd4a','#71c8ef','#8cdb9a','#aa8be8','#33394d','#fff'],chosen=colors[0],bc=document.querySelector('#balloon'),bctx=bc.getContext('2d');colors.forEach((c,i)=>{let s=document.createElement('button');s.className='swatch';s.style.background=c;s.onclick=()=>chosen=c;palette.append(s)});function drawBalloon(){bctx.clearRect(0,0,600,380);bctx.lineWidth=8;bctx.strokeStyle='#37415f';bctx.fillStyle='#fff';bctx.beginPath();bctx.ellipse(300,160,116,137,0,0,7);bctx.fill();bctx.stroke();bctx.beginPath();bctx.moveTo(282,292);bctx.lineTo(300,314);bctx.lineTo(318,292);bctx.closePath();bctx.fill();bctx.stroke();bctx.beginPath();bctx.moveTo(300,314);bctx.bezierCurveTo(270,335,335,341,300,365);bctx.stroke();bctx.fillStyle='#37415f';bctx.beginPath();bctx.arc(270,145,7,0,7);bctx.arc(330,145,7,0,7);bctx.fill();bctx.beginPath();bctx.arc(300,180,26,0,3.14);bctx.stroke()}drawBalloon();bc.onpointerdown=bc.onpointermove=e=>{if(e.type==='pointermove'&&!e.buttons)return;let r=bc.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*380/r.height;bctx.fillStyle=chosen;bctx.beginPath();bctx.arc(x,y,18,0,7);bctx.fill()};function question(){let a=Math.ceil(Math.random()*5),b=Math.ceil(Math.random()*4),ans=a+b,opts=new Set([ans]);while(opts.size<3)opts.add(Math.max(1,ans+Math.floor(Math.random()*5)-2));q.textContent=a+' + '+b+' = ?';answers.innerHTML='';mf.textContent='';[...opts].sort(()=>Math.random()-.5).forEach(n=>{let x=document.createElement('button');x.className='answer';x.textContent=n;x.onclick=()=>{if(n===ans){mf.textContent='Aferin, doğru cevap! ⭐';star();setTimeout(question,900)}else mf.textContent='Bir daha düşün, yapabilirsin! 💪'};answers.append(x)})}question();function startParty(){party.classList.add('show');for(let i=0;i<90;i++){let c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'%';c.style.background=colors[i%5];c.style.animationDelay=Math.random()+'s';party.append(c)}try{let a=new AudioContext();[523,659,784,1047].forEach((hz,i)=>{let o=a.createOscillator(),g=a.createGain();o.frequency.value=hz;g.gain.value=.07;o.connect(g);g.connect(a.destination);o.start(a.currentTime+i*.14);o.stop(a.currentTime+i*.14+.18)})}catch(e){}}function closeParty(){party.classList.remove('show');party.querySelectorAll('.conf').forEach(x=>x.remove())}</script></html>
